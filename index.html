<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808">
<title>GOLDEN ELECTRONICS | قاسم شبستانی</title>
<style>
:root{--gold:#d9b45b;--gold2:#f7e4a2;--black:#080808;--muted:#c9c1ae}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Tahoma,Arial,sans-serif;color:#fff}
body{min-height:100vh;display:grid;place-items:center;padding:22px;background-color:#080808;background-image:radial-gradient(ellipse at 15% 12%,rgba(196,151,49,.2),transparent 32%),radial-gradient(ellipse at 88% 82%,rgba(196,151,49,.16),transparent 28%),linear-gradient(135deg,transparent 0 34%,rgba(219,181,88,.12) 34.2%,transparent 35%,transparent 67%,rgba(219,181,88,.1) 67.2%,transparent 68%),repeating-linear-gradient(122deg,#080808 0 24px,#11100d 25px,#080808 28px);}
.card{position:relative;width:min(100%,430px);overflow:hidden;padding:34px 25px 28px;text-align:center;border:1px solid rgba(230,193,99,.72);border-radius:24px;background:linear-gradient(145deg,rgba(23,22,19,.97),rgba(5,5,5,.98));box-shadow:0 22px 70px #000,0 0 28px rgba(215,174,75,.12);}
.card:before{content:"";position:absolute;inset:7px;border:1px solid rgba(218,180,88,.25);border-radius:18px;pointer-events:none}
.logo{width:102px;height:102px;margin:0 auto 16px;filter:drop-shadow(0 0 13px rgba(224,184,79,.25))}.brand{direction:ltr;font-size:clamp(38px,11vw,51px);font-weight:900;letter-spacing:5px;line-height:1;color:var(--gold2);text-shadow:0 2px 18px rgba(221,179,77,.25)}.subtitle{direction:ltr;font-size:12px;letter-spacing:7px;margin:10px 0 27px;color:var(--gold);font-weight:bold}
.rule{height:1px;width:76%;margin:0 auto 24px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}h1{font-size:27px;margin:0 0 10px;font-weight:700}.job{color:var(--gold2);font-size:16px;margin:0 0 23px}.phone-label{font-size:12px;color:#bdb5a3;margin-bottom:8px}.phone{direction:ltr;display:inline-block;color:#fff;text-decoration:none;font-size:24px;font-weight:bold;letter-spacing:1px;margin-bottom:22px}.call{position:relative;display:flex;align-items:center;justify-content:center;gap:11px;margin:0 auto;width:min(100%,270px);padding:15px 20px;border-radius:12px;text-decoration:none;color:#17120a;background:linear-gradient(135deg,#f6e3a0,#c99b35);font-size:16px;font-weight:800;box-shadow:0 7px 24px rgba(205,162,56,.2);transition:transform .18s,filter .18s}.call:hover{transform:translateY(-2px);filter:brightness(1.08)}.footer{margin-top:24px;color:#8f8777;font-size:10px;letter-spacing:2px;direction:ltr}
@media(min-width:500px){.card{padding:40px 32px 31px}}
</style>
</head>
<body>
<main class="card">
  <svg class="logo" viewBox="0 0 120 120" role="img" aria-label="GOLDEN lightning shield"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff0b5"/><stop offset=".48" stop-color="#dfb84f"/><stop offset="1" stop-color="#8e6419"/></linearGradient></defs><path d="M60 5 105 22 101 69Q91 96 60 114 29 96 19 69L15 22Z" fill="#0b0b0a" stroke="url(#g)" stroke-width="3.5"/><path d="M60 13 96 27 92 67Q83 88 60 102 37 88 28 67L24 27Z" fill="none" stroke="#9b762b" stroke-width="1.2"/><path d="M67 24 42 63H58L51 91 80 51H63Z" fill="url(#g)" stroke="#f9e7a3" stroke-width="1" stroke-linejoin="round"/></svg>
  <div class="brand">GOLDEN</div>
  <div class="subtitle">ELECTRONICS</div>
  <div class="rule"></div>
  <h1>قاسم شبستانی</h1>
  <p class="job">برق‌کار ساختمان</p>
  <div class="phone-label">تماس مستقیم</div>
  <a class="phone" href="tel:+989022289418">0902 228 9418</a>
  <a class="call" href="tel:+989022289418"><span aria-hidden="true">☎</span> تماس با برق‌کار</a>
  <div class="footer">GOLDEN • ELECTRONICS</div>
</main>
</body>
</html>
